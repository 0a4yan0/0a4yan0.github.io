<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tooly</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #0f1115;
      --panel: #161a20;
      --panel-light: #1c2129;
      --text: #e6e9ef;
      --muted: #9aa1ac;
      --blue: #4f8cff;
      --orange: #ff9f43;
      --border: #262b34;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .brand {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
    }

    .nav-item.active {
      background: var(--panel-light);
      color: var(--text);
    }

    .nav-item:hover {
      background: var(--panel-light);
      color: var(--text);
    }

    /* Main */
    .main {
      flex: 1;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 22px;
      font-weight: 600;
    }

    .calculator {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      max-width: 420px;
    }

    .display {
      background: #0b0d11;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      text-align: right;
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .btn {
      background: var(--panel-light);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      color: var(--text);
      cursor: pointer;
    }

    .btn.operator {
      color: var(--blue);
    }

    .btn.equals {
      background: var(--blue);
      color: #fff;
      grid-column: span 2;
    }

    .btn.clear {
      color: var(--orange);
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand">Tooly</div>

    <nav class="nav">
      <div class="nav-item active">
        <i data-lucide="calculator"></i>
        Calculator
      </div>
      <div class="nav-item">
        <i data-lucide="function-square"></i>
        Scientific
      </div>
      <div class="nav-item">
        <i data-lucide="dollar-sign"></i>
        Currency
      </div>
      <div class="nav-item">
        <i data-lucide="ruler"></i>
        Unit Converter
      </div>
      <div class="nav-item">
        <i data-lucide="line-chart"></i>
        Graphing
      </div>
    </nav>
  </aside>

  <main class="main">
    <div class="header">
      <div class="title">Calculator</div>
    </div>

    <div class="calculator">
      <div class="display">0</div>

      <div class="buttons">
        <button class="btn clear">C</button>
        <button class="btn">±</button>
        <button class="btn">%</button>
        <button class="btn operator">÷</button>

        <button class="btn">7</button>
        <button class="btn">8</button>
        <button class="btn">9</button>
        <button class="btn operator">×</button>

        <button class="btn">4</button>
        <button class="btn">5</button>
        <button class="btn">6</button>
        <button class="btn operator">−</button>

        <button class="btn">1</button>
        <button class="btn">2</button>
        <button class="btn">3</button>
        <button class="btn operator">+</button>

        <button class="btn">0</button>
        <button class="btn">.</button>
        <button class="btn equals">=</button>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
